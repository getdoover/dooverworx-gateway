services:
  dooverworx-gateway:
    #image: kylemanna/openvpn:latest
    image: ghcr.io/getdoover/dooverworx-gateway:main
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./openvpn:/etc/openvpn
    environment:
      - APP_KEY=$APP_KEY
      - HEALTHCHECK_PORT=$HEALTHCHECK_PORT
    restart: unless-stopped
